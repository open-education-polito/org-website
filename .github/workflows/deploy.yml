name: Deploy to Production

on:
  push:
    branches:
      - master

permissions:
  contents: read

# Never run two deploys at once; let a running deploy finish instead of killing it mid-rsync
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --config _prod.yml

      # Loaded after the build so Jekyll and its gems never see the deploy key
      - name: Add SSH Deploy Key
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      # SSH_KNOWN_HOSTS is pinned in repo secrets, not fetched at deploy time
      - name: Add server to known_hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts

      - name: Deploy to Server
        env:
          PORT: ${{ secrets.PORT }}
          HOST: ${{ secrets.HOST }}
          USER: ${{ secrets.USER }}
        run: rsync --delete -av -e "ssh -p $PORT -o StrictHostKeyChecking=yes" ./_site/ "$USER@$HOST":/var/www/html/
