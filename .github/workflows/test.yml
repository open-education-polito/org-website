name: Test OEP Website

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@e5517072e87f198d9533967ae13d97c11b604005 # v1.99.0
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Check internal links and images
        run: bundle exec htmlproofer ./_site --disable-external
